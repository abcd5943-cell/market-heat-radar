name: Test Cboe CSV Save

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-save:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4 pandas_market_calendars
      - name: Fetch 10 verified trading dates
        run: python fetch_cboe.py --start 2026-11-09 --end 2026-11-20 --limit 10
      - name: Upload CSV files for inspection
        uses: actions/upload-artifact@v4
        with:
          name: cboe-csv-test
          path: |
            equity_put_call.csv
            total_put_call.csv
          if-no-files-found: error
