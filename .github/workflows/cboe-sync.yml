name: Sync Cboe Put Call History

"on":
  workflow_dispatch:
  schedule:
    # UTC 每兩小時一次；GitHub 排程可能延遲
    - cron: '17 */2 * * *'

permissions:
  contents: write

concurrency:
  group: cboe-history-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Cboe dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pandas_market_calendars
      - name: Fetch at most 25 trading days with 10-second pauses
        id: fetch
        continue-on-error: true
        run: python fetch_cboe.py --start 2020-01-01 --limit 25 --order newest --delay 10
      - name: Validate CSV records
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          for name in ('equity_put_call.csv', 'total_put_call.csv'):
              path = Path(name)
              if not path.is_file():
                  raise SystemExit(f'Missing {name}')
              with path.open(encoding='utf-8-sig', newline='') as f:
                  rows = list(csv.DictReader(f))
              if not rows or set(rows[0]) != {'date', 'ratio'}:
                  raise SystemExit(f'Invalid {name}')
              dates = [r['date'] for r in rows]
              if dates != sorted(set(dates)):
                  raise SystemExit(f'Dates not sorted or duplicated in {name}')
              print(f'{name}: {len(rows)} records; latest {dates[-1]}')
          PY
      - name: Commit updated CSV files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add equity_put_call.csv total_put_call.csv
          if git diff --cached --quiet; then
            echo 'No CSV changes to commit'
          else
            git commit -m 'data: update Cboe put-call history'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report fetch failure
        if: steps.fetch.outcome == 'failure'
        run: |
          echo 'Cboe fetch failed or was rate-limited. Existing CSV changes were saved.'
          exit 1
