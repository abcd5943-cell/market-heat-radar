name: Test Cboe Put Call Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-cboe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pandas
      - name: Test Cboe public statistics page
        run: python fetch_cboe.py
