name: Update Market Heat

'on':
  workflow_dispatch:
  schedule:
    - cron: '20 23 * * 1-5'

permissions:
  contents: write

concurrency:
  group: market-heat-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build dashboard data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python build_data.py
      - name: Validate JSON and freshness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/dashboard.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert isinstance(d['history'],list) and len(d['history'])>100
          print('History:',len(d['history']))
          print('Latest complete:',d['latest_complete_date'])
          print('FINRA quality:',d['margin_date_quality'])
          if d['latest_complete_date'] is None:
              print('WARNING: no complete five-factor data yet; Cboe backfill may be insufficient')
          PY
      - name: Commit dashboard data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dashboard.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update dashboard data'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
